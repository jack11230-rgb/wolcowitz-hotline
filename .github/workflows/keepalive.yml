name: keepalive
# Pings the hotline every 10 minutes from 6am to midnight New York time so the
# free Render instance is awake when people call. (Overnight calls fall back to
# the static greeting while it wakes up.)
on:
  schedule:
    - cron: "*/10 10-23 * * *"
    - cron: "*/10 0-4 * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS --max-time 60 https://wolcowitz-hotline-davz.onrender.com/health || true
