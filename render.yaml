databases:
  - name: wolcowitz-hotline-db
    plan: free
    region: virginia
    databaseName: hotline
    user: hotline
    ipAllowList: []

services:
  - type: web
    name: wolcowitz-hotline
    runtime: node
    plan: free
    region: virginia
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: wolcowitz-hotline-db
          property: connectionString
      - key: PGSSL
        value: "off"
      - key: ADMIN_PIN
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: NOTIFY_EMAIL
        value: jack11230@gmail.com
      - key: RESEND_FROM
        value: "Wolcowitz Hotline <onboarding@resend.dev>"
